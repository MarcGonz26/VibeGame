<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vibe Gaming</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#0f172a;
    color:#fff;
}

/* Header */
header{
    text-align:center;
    padding:20px;
    background:#1e293b;
}

header h1{
    margin-bottom:10px;
}

#search{
    width:100%;
    max-width:500px;
    padding:12px;
    border:none;
    border-radius:8px;
}

/* Game List */
#gameListView{
    display:block;
}

.games{
    max-width:1200px;
    margin:auto;
    padding:20px;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:20px;
}

.card{
    background:#1e293b;
    border-radius:12px;
    overflow:hidden;
    transition:.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.card img{
    width:100%;
    height:180px;
    object-fit:cover;
}

.content{
    padding:15px;
}

.content p{
    margin:10px 0;
}

.play-btn{
    background:#3b82f6;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:8px;
    cursor:pointer;
}

.play-btn:hover{
    background:#2563eb;
}

/* Viewer */
#gameViewer{
    display:none;
    position:fixed;
    inset:0;
    z-index:1000;
    background:#000;
}

.viewer-header{
    height:60px;
    background:#111827;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
}

.back-btn{
    background:#ef4444;
    color:white;
    border:none;
    padding:10px 16px;
    border-radius:8px;
    cursor:pointer;
}

.back-btn:hover{
    background:#dc2626;
}

#gameTitle{
    font-size:18px;
}

#gameFrame{
    width:100%;
    height:calc(100vh - 60px);
    border:none;
    background:#000;
}
</style>
</head>
<body>

<div id="gameListView">

    <header>
        <h1>🎮 VibeGame</h1>
        <input type="text" id="search" placeholder="Search games...">
    </header>

    <div class="games" id="games"></div>

</div>

<div id="gameViewer">

    <div class="viewer-header">
        <button class="back-btn" onclick="closeGame()">
            ← Back
        </button>

        <div id="gameTitle"></div>
        
        <button class="back-btn" onclick="toggleFullscreen()">
            Fullscreen
        </button>
        <button class="back-btn" onclick="shareGame()">
            Share
        </button>
    </div>

    <iframe
        id="gameFrame"
        allow="autoplay; fullscreen; gamepad; accelerometer; gyroscope"
        loading="eager"
        referrerpolicy="origin">
    </iframe>

</div>

<script>

let gamesData = [];

fetch('games.json')
.then(response => response.json())
.then(data => {

    gamesData = data;

    renderGames(data);

    checkDeepLink();

});

function checkDeepLink() {

    const params = new URLSearchParams(window.location.search);

    const slug = params.get('game');

    if (!slug) return;

    const game = gamesData.find(g => g.slug === slug);

    if (!game) return;

    document.getElementById('gameListView').style.display = 'none';

    document.getElementById('gameViewer').style.display = 'block';

    document.getElementById('gameTitle').innerText = game.title;

    document.getElementById('gameFrame').src = game.url;

    document.title = game.title + ' | VibeGame';
}

function renderGames(games){

    const container = document.getElementById('games');

    container.innerHTML = games.map(game => `
        <div class="card">
            <img src="${game.image}" alt="${game.title}">
            <div class="content">
                <h3>${game.title}</h3>
                <p>${game.description}</p>
                <button
                    class="play-btn"
                    data-slug="${game.slug}">
                    Play Now
                </button>
            </div>
        </div>
    `).join('');
}

document.getElementById('search').addEventListener('input', function(){

    const keyword = this.value.toLowerCase();

    const filtered = gamesData.filter(game =>
        game.title.toLowerCase().includes(keyword)
    );

    renderGames(filtered);
});

function openGame(slug) {

    const game = gamesData.find(g => g.slug === slug);

    if (!game) return;

    document.getElementById('gameListView').style.display = 'none';
    document.getElementById('gameViewer').style.display = 'block';

    document.getElementById('gameTitle').innerText = game.title;

    document.getElementById('gameFrame').src = game.url.trim();

    history.pushState(
        {},
        '',
        '?game=' + encodeURIComponent(slug)
    );

    document.title = game.title + ' | VibeGame';
}
function closeGame() {

    document.getElementById('gameViewer').style.display = 'none';

    document.getElementById('gameListView').style.display = 'block';

    document.getElementById('gameFrame').src = '';

    history.pushState({}, '', './');

    document.title = 'VibeGame';
}

function toggleFullscreen(){

    const iframe = document.getElementById('gameFrame');

    if (iframe.requestFullscreen) {
        iframe.requestFullscreen();
    } else if (iframe.webkitRequestFullscreen) {
        iframe.webkitRequestFullscreen();
    } else if (iframe.msRequestFullscreen) {
        iframe.msRequestFullscreen();
    }
}

function shareGame() {

    navigator.clipboard.writeText(window.location.href);

    alert("Game link copied!");
}    
    
</script>

</body>
</html>
