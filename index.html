<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VibeGame</title>

<style>
body{
    margin:0;
    font-family:Segoe UI, sans-serif;
    background:#0f172a;
    color:#fff;
}

header{
    padding:30px;
    text-align:center;
    background:#1e293b;
}

h1{
    margin:0;
}

#search{
    width:90%;
    max-width:500px;
    padding:12px;
    margin-top:15px;
    border:none;
    border-radius:10px;
}

.games{
    max-width:1200px;
    margin:auto;
    padding:20px;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:20px;
}

.card{
    background:#1e293b;
    border-radius:15px;
    overflow:hidden;
    transition:.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.card img{
    width:100%;
    height:180px;
    object-fit:cover;
}

.content{
    padding:15px;
}

.play-btn{
    display:inline-block;
    margin-top:10px;
    padding:10px 15px;
    background:#3b82f6;
    color:#fff;
    text-decoration:none;
    border-radius:8px;
}

.play-btn:hover{
    background:#2563eb;
}
</style>
</head>
<body>

<header>
    <h1>🎮 VibeGame</h1>
    <p>Play Free Browser Games</p>

    <input type="text" id="search" placeholder="Search games...">
</header>

<div class="games" id="games"></div>

<script>

let gamesData = [];

fetch('games.json')
.then(response => response.json())
.then(data => {
    gamesData = data;
    renderGames(data);
});

function renderGames(games){
    const container = document.getElementById('games');

    container.innerHTML = games.map(game => `
        <div class="card">
            <img src="${game.image}" alt="${game.title}">
            <div class="content">
                <h3>${game.title}</h3>
                <p>${game.description}</p>
                <a class="play-btn"
                   href="${game.url}"
                   target="_blank">
                   Play Now
                </a>
            </div>
        </div>
    `).join('');
}

document.getElementById('search').addEventListener('input', function(){

    const keyword = this.value.toLowerCase();

    const filtered = gamesData.filter(game =>
        game.title.toLowerCase().includes(keyword)
    );

    renderGames(filtered);
});

</script>

</body>
</html>
